<!-- based on Chris Deleon's video: https://www.youtube.com/watch?v=xGmXxpIj6vs -->

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Snake Game</title>
    <!-- Top Utility Bar: Placed away from gameplay thumbs -->
<div class="utility-bar">
    <button id="restart" class="util-btn" onclick="window.location.reload();">🔄 Restart</button>
</div>

    <link href="styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>

    <h1> SNAKE </h1>

    <canvas id = "mycanvas" width="400" height="400"> </canvas>
    <script src="helper.js"></script>
    <script src="script.js"></script>

 <!-- Main responsive mobile overlay -->
<div id="mobile-controller-overlay">
    
    <!-- Left Side: D-Pad Layout Cluster -->
    <div class="d-pad-cluster">
        <div class="dpad-grid">
            <div class="dpad-empty"></div>
            <button id="up" class="ctrl-btn dpad-btn">↑</button>
            <div class="dpad-empty"></div>
            
            <button id="left" class="ctrl-btn dpad-btn">←</button>
            <div class="dpad-center"></div>
            <button id="right" class="ctrl-btn dpad-btn">→</button>
            
            <div class="dpad-empty"></div>
            <button id="down" class="ctrl-btn dpad-btn">↓</button>
            <div class="dpad-empty"></div>
        </div>
    </div>

    <!-- Right Side: Action Buttons Section (2 Columns of 3) -->
    <div class="action-cluster">
        <button id="1" class="ctrl-btn action-btn">1</button>
        <button id="2" class="ctrl-btn action-btn">2</button>
        <button id="3" class="ctrl-btn action-btn">3</button>
        <button id="4" class="ctrl-btn action-btn">4</button>
        <button id="5" class="ctrl-btn action-btn">5</button>
        <button id="6" class="ctrl-btn action-btn">6</button>
    </div>

</div>

    
  </body>
</html>
